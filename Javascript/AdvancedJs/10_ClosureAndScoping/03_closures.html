<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<button id="orange">Orange</button>
<button id="blue">Blue</button>

</body>

<script>


function clickHandeller(color){
    return function(){
        document.body.style.backgroundColor=`${color}`
    }
}

document.getElementById('orange').onclick=clickHandeller("orange")
document.getElementById('blue').onclick=clickHandeller("blue")



</script>
</html>
