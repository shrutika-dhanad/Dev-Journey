<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <button id="decrease">-</button>
    <span id="count">0</span>
    <button id="increase">+</button>

    <br>
    <br>

<!-- //inp character project 2 -->
<div>
<textarea id="msg"></textarea>
<p>Characters : <span id="valuecounts">0</span></p>

</div>


<!-- //form validation project 3  -->


<form  id="form">

    <input  id="username">

</form>


<!-- event delegation project 4 -->


<ul id="products">

<li class="delete">Delete apple</li>
<li class="delete">delete banana</li>
<li class="delete">delete mango</li>
</ul>

<p id="para">Hello</p>
<button id="submit">Submit</button>
</body>


<button class="myBGC">backhround changes</button>
<script>


const inc=document.querySelector('#increase')
const count=document.getElementById('count')
const dec=document.querySelector('#decrease')


let value=0;


inc.addEventListener('click', function(){
    value++;
    count.textContent=value;
})

dec.addEventListener('click', function(){
    value--;
    count. textContent= value;

})


let msg = document.querySelector('#msg')
let counter = document.querySelector('#valuecounts')


msg.addEventListener('input', function(){
    counter.textContent= msg.value.length;

})



const form = document.querySelector('#form')
const username = document.querySelector('#username')

form.addEventListener('submit', function(e){
    event.preventDefault();

    if(username.valye.trim()===""){
        console.log("usernmae is required")
        return 
    }
    console.log("form submitted successfully")
})



const product= document.querySelector('#products')

product.addEventListener('click', function(e){
    if(e.target.matches(".delete")){
        e.target.closest('li').remove();

    }
})

const btns = document.getElementById('submit')
const para = document.getElementById('para')

btns.addEventListener('click', function(e){
    para.textContent="hello shrutika "
})


const bgc= document.querySelector('.myBGC')
const body = document.querySelector('body')
bgc.addEventListener('click', function(){


    body.style.backgroundColor='yellow'
  
})

</script>
</html>
