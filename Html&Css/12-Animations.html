<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    .container{
        width: 100vw;
        height: 100vh;
        background-color: beige;
        border: 5px solid black;
    }
  .box{
    width: 350px;
    height: 90px;
    background-color:blueviolet;
    border: 2p solid grey;
    margin: 10px;
    border-radius: 20px ;
    position: relative;
    animation:rightMovement;
    /* animation-duration: 5s; */
    /* animation-iteration-count: 2; */
    /* animation-delay: 2s; */
    /* animation-timing-function: linear; */
    /* animation-timing-function: ease-in; */
    /* animation-timing-function: ease-in-out; */
    /* animation-timing-function: ease-out; */
    /* animation-timing-function: cubic-bezier(10, 1.85,2,9.8,0); */
    /* animation-timing-function: cubic-bezier(1, -0.4,1,1); */
    /* animation-direction:alternate ; */
    /* animation-direction: alternate-reverse */
    /* animation-fill-mode: forwards;  it can top forward */
    /* animation-fill-mode: both; */


    /* shot-hand notation */
    /* animation:duaration |easinf-function | delay | iter-count | direction | fill-mode | play-state | name ; */
    animation: 5s linear 1s  infinite   alternate none running rightMovement ;

  }.box2{
width: 350px;
    height: 90px;
    background-color:blueviolet;
    border: 2p solid grey;
    margin: 10px;
    border-radius: 20px ;
    position: relative;
    animation:leftMovement;

    animation: 5s ease-in 1s  infinite   alternate none running leftMovement ;

  }
@keyframes rightMovement {
    from{
    top: 0;;
    left: 0;
    }
    to{
    top: 0;
    left:1350px;
    }
}

@keyframes leftMovement {
    from{
    top: 650px;;
    left: 1350px;
    }
    to{
    top:650px;
    left:0;
    }
}

#circle{
    height: 200px;
    width: 200px;
    border: 2px dashed black;
    border-radius: 50%;
    background-color:yellow;
    position: relative;
    top: 170px;
    left: 30%;
    animation: 5s ease-in-out 0s  infinite   alternate-reverse none running circle ;

}
@keyframes circle {
0%{
top: 1%;
left: 5%;
}
30%{
top: 5%;
left: 90%;
}
60%{
top: 60%;
left: 10%;
}
100%{
top: 45%;
left: 90%;
}
   
}
    </style>
</head>
<body>
    <!-- Animation :- 
          when an perticular element /components is shifting from 1 styling to another styling this process is 
        called aninmation 
     * @keyframes:=> 
           When you specify CSS styles inside the @keyframes rule,
             the animation will gradually change from the current style  to the new style at certain times.   
        !-->



        <div class="container">
    <div class="box">

    </div>


    

    <div class="box2">

    </div>

<div id="circle">
        
    </div>

        </div>

     
</body>
</html>
