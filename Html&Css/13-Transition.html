  .box{

    /* transition-timing-function:linear; */
    transition-timing-function: ease-out;
    /* transition-delay: 1s; */
 

    /* shorthand notation  */
/* name duration */
/* transition: all 2s; */

/* name duration delay */
/* transition: all 2s 1s; */

/* name duration func  delay*/


/* name width height  */
transition: width 2s height 11s ;


}

.box:hover{

    background-color:rgb(197, 16, 155);
}
